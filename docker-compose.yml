services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://therapeutic:therapeutic@postgres:5432/therapeutic_ai
      QDRANT_URL: http://qdrant:6333
      KNOWLEDGE_BASE_DIR: /app/data/knowledge_base
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - "./backend:/app"
      - "embedding_cache:/root/.cache/huggingface"
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: therapeutic
      POSTGRES_PASSWORD: therapeutic
      POSTGRES_DB: therapeutic_ai
    ports: ["5433:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U therapeutic -d therapeutic_ai"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrant_data:/qdrant/storage"]
volumes:
  postgres_data:
  qdrant_data:
  embedding_cache:
